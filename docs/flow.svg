<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="210" rx="14" fill="#0b0e14"/>
  <text x="24" y="36" fill="#e6e9ef" font-size="18" font-weight="600">Tempo Payout Cockpit — one atomic 0x76 batch</text>

  <!-- stage boxes -->
  <g>
    <rect x="24" y="72" width="132" height="62" rx="9" fill="#141925" stroke="#273043"/>
    <text x="90" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">CSV</text>
    <text x="90" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">address, amount, memo</text>

    <rect x="180" y="72" width="132" height="62" rx="9" fill="#141925" stroke="#273043"/>
    <text x="246" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">Validate</text>
    <text x="246" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">per-row checks</text>

    <rect x="336" y="72" width="132" height="62" rx="9" fill="#141925" stroke="#273043"/>
    <text x="402" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">Preview</text>
    <text x="402" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">&#931; vs balance</text>

    <rect x="492" y="72" width="132" height="62" rx="9" fill="#141925" stroke="#273043"/>
    <text x="558" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">Confirm</text>
    <text x="558" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">sign in wallet</text>

    <rect x="648" y="72" width="132" height="62" rx="9" fill="#16203a" stroke="#4c8bf5"/>
    <text x="714" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">0x76 batch</text>
    <text x="714" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">N transfers &#183; atomic</text>

    <rect x="804" y="72" width="132" height="62" rx="9" fill="#141925" stroke="#273043"/>
    <text x="870" y="100" fill="#e6e9ef" font-size="13" font-weight="600" text-anchor="middle">Receipt</text>
    <text x="870" y="120" fill="#8a93a6" font-size="10.5" text-anchor="middle">+ local history</text>
  </g>

  <!-- arrows -->
  <g stroke="#4c8bf5" stroke-width="2" fill="#4c8bf5">
    <path d="M159 103 L173 103"/><path d="M173 99 L179 103 L173 107 Z"/>
    <path d="M315 103 L329 103"/><path d="M329 99 L335 103 L329 107 Z"/>
    <path d="M471 103 L485 103"/><path d="M485 99 L491 103 L485 107 Z"/>
    <path d="M627 103 L641 103"/><path d="M641 99 L647 103 L641 107 Z"/>
    <path d="M783 103 L797 103"/><path d="M797 99 L803 103 L797 107 Z"/>
  </g>

  <text x="24" y="178" fill="#8a93a6" font-size="12">Non-custodial &#183; signed in your wallet &#183; all-or-nothing &#183; no backend (localStorage)</text>
</svg>
